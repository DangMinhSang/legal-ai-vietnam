[build-system]
requires = ["setuptools>=78.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "legal-ai-vietnam"
version = "0.1.0"
description = "AI system for Vietnamese criminal case analysis and prediction"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # API Framework (already installed)
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    # Data validation (already installed)
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Database (NEEDS INSTALL)
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.9",
    # Embeddings - ONNX based, no PyTorch needed (already installed)
    "fastembed>=0.2.0",
    # LLM (already installed)
    "litellm>=1.0.0",
    "anthropic>=0.20.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    # Document processing (already installed)
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "Pillow>=10.0.0",
    # HTTP & async (already installed)
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "tenacity>=8.0.0",
    # Utilities (already installed)
    "loguru>=0.7.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "regex>=2023.0.0",
    # Data science (NEEDS INSTALL)
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Vietnamese NLP
    "underthesea>=6.8.0",
    # Dataset loading
    "datasets>=2.14.0",
    "huggingface-hub>=0.17.0",
    # Web scraping (respectful)
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "black>=23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

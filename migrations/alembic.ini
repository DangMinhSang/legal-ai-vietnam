# Alembic configuration file for legal-ai-vietnam.
#
# Database backend: SQLite via aiosqlite (async).
# The actual database path is resolved at runtime in env.py from the project
# root, so the sqlalchemy.url below is only a fallback placeholder.
#
# Common commands (run from project root):
#
#   alembic revision --autogenerate -m "describe_change"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic history --verbose
#   alembic current

[alembic]
# Fallback URL – overridden at runtime in env.py
# Format: sqlite+aiosqlite:///path/to/file.db
script_location = migrations

# Path to generated revision scripts (relative to script_location)
version_locations = %(here)s/versions

# File name template for new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long slug names in filenames
truncate_slug_length = 40

# Timezone for %%(year)d etc. in file_template; use UTC to be consistent with
# the database timestamps.
timezone = UTC

# Do not output "from alembic import op" etc. in generated migrations
# (they are added by the template)
output_encoding = utf-8

# sqlalchemy.url is set dynamically in env.py from the engine URL.
# Leave this as a sentinel so Alembic does not complain about a missing key.
sqlalchemy.url = sqlite+aiosqlite:///data/db/legal_ai.db


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
